# Historical workflow: archived outside Actions discovery; not for current releases.
name: Apply native settings hotfix v2
on:
  push:
    paths:
      - .github/workflows/hotfix-native-settings-v2.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/core-rebuild
      - name: Write patched files
        shell: pwsh
        run: |
          $items = @{
            'rebuild/src/RoomSwitcherTray.Core/SettingsWindow.cs' = ''
            'rebuild/src/RoomSwitcherTray.Core/App.xaml.cs' = ''
            'rebuild/src/RoomSwitcherTray.Core/RoomSwitcherTray.Core.csproj' = ''
          }
          foreach ($item in $items.GetEnumerator()) {
            [IO.File]::WriteAllBytes((Join-Path $env:GITHUB_WORKSPACE $item.Key), [Convert]::FromBase64String($item.Value))
          }
      - name: Commit hotfix
        shell: pwsh
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add rebuild/src/RoomSwitcherTray.Core/SettingsWindow.cs rebuild/src/RoomSwitcherTray.Core/App.xaml.cs rebuild/src/RoomSwitcherTray.Core/RoomSwitcherTray.Core.csproj
          git diff --cached --quiet; if ($LASTEXITCODE -eq 0) { exit 0 }
          git commit -m "fix: replace settings UI with native Win32 window"
          git push origin HEAD:codex/core-rebuild
