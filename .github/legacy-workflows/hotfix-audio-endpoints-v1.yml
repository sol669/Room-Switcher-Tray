# Historical workflow: archived outside Actions discovery; not for current releases.
name: Apply complete audio endpoint enumeration
on:
  push:
    paths:
      - .github/workflows/hotfix-audio-endpoints-v1.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/core-rebuild
      - name: Write patched files
        shell: pwsh
        run: |
          $items = @{
            'rebuild/src/RoomSwitcherTray.Core/Models.cs' = ''
            'rebuild/src/RoomSwitcherTray.Core/Services/AudioService.cs' = ''
            'rebuild/src/RoomSwitcherTray.Core/Services/ScenarioService.cs' = ''
          }
          foreach ($item in $items.GetEnumerator()) {
            $target = Join-Path $env:GITHUB_WORKSPACE $item.Key
            [IO.File]::WriteAllBytes($target, [Convert]::FromBase64String($item.Value))
          }
      - name: Commit patch
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- 'rebuild/src/RoomSwitcherTray.Core/Models.cs' 'rebuild/src/RoomSwitcherTray.Core/Services/AudioService.cs' 'rebuild/src/RoomSwitcherTray.Core/Services/ScenarioService.cs'
          if (git diff --cached --quiet) { exit 0 }
          git commit -m "feat: enumerate inactive audio endpoints"
          git push origin HEAD:codex/core-rebuild
