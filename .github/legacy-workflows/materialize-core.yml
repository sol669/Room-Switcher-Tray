# Historical workflow: archived outside Actions discovery; not for current releases.
name: Materialize clean core sources

on:
  workflow_dispatch:
  push:
    branches: [codex/core-rebuild]
    paths: [.github/workflows/materialize-core.yml]

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Materialize clean rebuild sources
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path 'rebuild/src/RoomSwitcherTray.Core' | Out-Null
          [IO.File]::WriteAllBytes('rebuild/src/RoomSwitcherTray.Core/RoomSwitcherTray.Core.csproj', [Convert]::FromBase64String(''))
          New-Item -ItemType Directory -Force -Path 'rebuild/src/RoomSwitcherTray.Core' | Out-Null
          [IO.File]::WriteAllBytes('rebuild/src/RoomSwitcherTray.Core/app.manifest', [Convert]::FromBase64String(''))
          New-Item -ItemType Directory -Force -Path 'rebuild/src/RoomSwitcherTray.Core' | Out-Null
          [IO.File]::WriteAllBytes('rebuild/src/RoomSwitcherTray.Core/App.xaml', [Convert]::FromBase64String(''))
          New-Item -ItemType Directory -Force -Path 'rebuild/src/RoomSwitcherTray.Core' | Out-Null
          [IO.File]::WriteAllBytes('rebuild/src/RoomSwitcherTray.Core/App.xaml.cs', [Convert]::FromBase64String(''))
          New-Item -ItemType Directory -Force -Path 'rebuild/src/RoomSwitcherTray.Core' | Out-Null
          [IO.File]::WriteAllBytes('rebuild/src/RoomSwitcherTray.Core/Models.cs', [Convert]::FromBase64String(''))
          New-Item -ItemType Directory -Force -Path 'rebuild/src/RoomSwitcherTray.Core' | Out-Null
          [IO.File]::WriteAllBytes('rebuild/src/RoomSwitcherTray.Core/NativeTheme.cs', [Convert]::FromBase64String(''))
          New-Item -ItemType Directory -Force -Path 'rebuild/src/RoomSwitcherTray.Core' | Out-Null
          [IO.File]::WriteAllBytes('rebuild/src/RoomSwitcherTray.Core/SettingsWindow.xaml', [Convert]::FromBase64String(''))
          New-Item -ItemType Directory -Force -Path 'rebuild/src/RoomSwitcherTray.Core' | Out-Null
          [IO.File]::WriteAllBytes('rebuild/src/RoomSwitcherTray.Core/SettingsWindow.xaml.cs', [Convert]::FromBase64String(''))
          New-Item -ItemType Directory -Force -Path 'rebuild/src/RoomSwitcherTray.Core/Interop' | Out-Null
          [IO.File]::WriteAllBytes('rebuild/src/RoomSwitcherTray.Core/Interop/DisplayNative.cs', [Convert]::FromBase64String(''))
          New-Item -ItemType Directory -Force -Path 'rebuild/src/RoomSwitcherTray.Core/Interop' | Out-Null
          [IO.File]::WriteAllBytes('rebuild/src/RoomSwitcherTray.Core/Interop/TrayNative.cs', [Convert]::FromBase64String(''))
          New-Item -ItemType Directory -Force -Path 'rebuild/src/RoomSwitcherTray.Core/Services' | Out-Null
          [IO.File]::WriteAllBytes('rebuild/src/RoomSwitcherTray.Core/Services/AudioService.cs', [Convert]::FromBase64String(''))
          New-Item -ItemType Directory -Force -Path 'rebuild/src/RoomSwitcherTray.Core/Services' | Out-Null
          [IO.File]::WriteAllBytes('rebuild/src/RoomSwitcherTray.Core/Services/DisplayService.cs', [Convert]::FromBase64String(''))
          New-Item -ItemType Directory -Force -Path 'rebuild/src/RoomSwitcherTray.Core/Services' | Out-Null
          [IO.File]::WriteAllBytes('rebuild/src/RoomSwitcherTray.Core/Services/ScenarioService.cs', [Convert]::FromBase64String(''))
          New-Item -ItemType Directory -Force -Path 'rebuild/src/RoomSwitcherTray.Core/Services' | Out-Null
          [IO.File]::WriteAllBytes('rebuild/src/RoomSwitcherTray.Core/Services/SettingsStore.cs', [Convert]::FromBase64String(''))
          New-Item -ItemType Directory -Force -Path 'rebuild/src/RoomSwitcherTray.Core/Services' | Out-Null
          [IO.File]::WriteAllBytes('rebuild/src/RoomSwitcherTray.Core/Services/TrayIconFactory.cs', [Convert]::FromBase64String(''))
          New-Item -ItemType Directory -Force -Path 'rebuild/src/RoomSwitcherTray.Core/Services' | Out-Null
          [IO.File]::WriteAllBytes('rebuild/src/RoomSwitcherTray.Core/Services/TrayService.cs', [Convert]::FromBase64String(''))
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- rebuild
          git commit -m "Materialize clean two-scenario core"
          git push
