# Historical workflow: archived outside Actions discovery; not for current releases.
name: Make inactive endpoint properties optional
on:
  push:
    paths:
      - .github/workflows/hotfix-audio-endpoints-v3.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/core-rebuild
      - name: Write corrected audio service
        shell: pwsh
        run: |
          $target = Join-Path $env:GITHUB_WORKSPACE 'rebuild/src/RoomSwitcherTray.Core/Services/AudioService.cs'
          [IO.File]::WriteAllBytes($target, [Convert]::FromBase64String(''))
      - name: Commit patch
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- 'rebuild/src/RoomSwitcherTray.Core/Services/AudioService.cs'
          if (git diff --cached --quiet) { exit 0 }
          git commit -m "fix: tolerate missing inactive endpoint properties"
          git push origin HEAD:codex/core-rebuild
