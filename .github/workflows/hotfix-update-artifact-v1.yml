name: Add update-only artifact
on:
  push:
    paths:
      - .github/workflows/hotfix-update-artifact-v1.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/core-rebuild
      - name: Write workflow
        shell: pwsh
        run: |
          $target = Join-Path $env:GITHUB_WORKSPACE '.github/workflows/build-core-rebuild.yml'
          [IO.File]::WriteAllBytes($target, [Convert]::FromBase64String(''))
      - name: Commit workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- .github/workflows/build-core-rebuild.yml
          git diff --cached --quiet && exit 0
          git commit -m "build: add update-only artifact"
          git push origin HEAD:codex/core-rebuild
