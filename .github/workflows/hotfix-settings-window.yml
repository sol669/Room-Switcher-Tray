name: Apply settings window hotfix

on:
  workflow_dispatch:
  push:
    branches: [codex/core-rebuild]
    paths: [.github/workflows/hotfix-settings-window.yml]

permissions:
  contents: write

jobs:
  hotfix:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace XAML settings window
        shell: pwsh
        run: |
          Remove-Item rebuild/src/RoomSwitcherTray.Core/SettingsWindow.xaml -ErrorAction SilentlyContinue
          Remove-Item rebuild/src/RoomSwitcherTray.Core/SettingsWindow.xaml.cs -ErrorAction SilentlyContinue
          [IO.File]::WriteAllBytes('rebuild/src/RoomSwitcherTray.Core/SettingsWindow.cs', [Convert]::FromBase64String(''))
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- rebuild
          git commit -m "Replace fragile XAML settings window"
          git push
