name: Build Core v0.8.1

on:
  push:
    branches:
      - codex/core-rebuild
    paths:
      - rebuild/**
      - .github/workflows/build-core-rebuild-update.yml
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish self-contained Core v0.8.1
        run: >-
          dotnet publish rebuild/src/RoomSwitcherTray.Core/RoomSwitcherTray.Core.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:WindowsAppSDKSelfContained=true
          -o artifacts/Room-Switcher-Tray-Core

      - name: Include compiled app XAML resources
        shell: pwsh
        run: |
          $buildRoot = Join-Path $env:GITHUB_WORKSPACE 'rebuild/src/RoomSwitcherTray.Core/bin/Release'
          $publishRoot = Join-Path $env:GITHUB_WORKSPACE 'artifacts/Room-Switcher-Tray-Core'
          $appXbf = Get-ChildItem -LiteralPath $buildRoot -Recurse -File -Filter 'App.xbf' |
            Sort-Object LastWriteTimeUtc -Descending |
            Select-Object -First 1
          $appPri = Get-ChildItem -LiteralPath $buildRoot -Recurse -File -Filter 'RoomSwitcherTray.pri' |
            Sort-Object LastWriteTimeUtc -Descending |
            Select-Object -First 1
          if ($null -eq $appXbf -or $null -eq $appPri) {
            throw 'Compiled RoomSwitcher XAML resources were not found.'
          }
          Copy-Item -LiteralPath $appXbf.FullName -Destination $publishRoot -Force
          Copy-Item -LiteralPath $appPri.FullName -Destination $publishRoot -Force

      - name: Upload full Core v0.8.1
        uses: actions/upload-artifact@v4
        with:
          name: RoomSwitcher-Core-v0.8.1-win-x64
          path: artifacts/Room-Switcher-Tray-Core/**
          if-no-files-found: error
          compression-level: 9

      - name: Prepare update-only package
        shell: pwsh
        run: |
          $source = Join-Path $env:GITHUB_WORKSPACE 'artifacts/Room-Switcher-Tray-Core'
          $target = Join-Path $env:GITHUB_WORKSPACE 'artifacts/Room-Switcher-Tray-Update'
          New-Item -ItemType Directory -Force -Path $target | Out-Null
          Get-ChildItem -LiteralPath $source -File -Filter 'RoomSwitcherTray*' |
            Copy-Item -Destination $target
          Get-ChildItem -LiteralPath $source -File -Filter '*.pri' -ErrorAction SilentlyContinue |
            Copy-Item -Destination $target
          Get-ChildItem -LiteralPath $source -File -Filter '*.xbf' -ErrorAction SilentlyContinue |
            Copy-Item -Destination $target
          $assets = Join-Path $source 'Assets'
          if (Test-Path -LiteralPath $assets) {
            Copy-Item -LiteralPath $assets -Destination $target -Recurse
          }

      - name: Upload update package v0.8.1
        uses: actions/upload-artifact@v4
        with:
          name: RoomSwitcher-Update-v0.8.1-win-x64
          path: artifacts/Room-Switcher-Tray-Update/**
          if-no-files-found: error
          compression-level: 9
